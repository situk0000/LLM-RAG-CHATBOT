<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .doc-status {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 12px;
        }

        .doc-status.loaded {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .upload-section {
            width: 30%;
            padding: 24px;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .upload-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f0f4ff;
        }

        .upload-area:hover {
            background: #e8ecff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ecff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-area p {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-area small {
            color: #999;
            display: block;
            font-size: 12px;
        }

        #pdfInput {
            display: none;
        }

        .file-name {
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            color: #333;
            word-break: break-word;
        }

        .reset-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .reset-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .reset-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.bot .message-content {
            background: #e8ecff;
            color: #333;
            border-left: 3px solid #667eea;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 8px 0 8px 8px;
        }

        .sources {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-section {
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #queryInput {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        #queryInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 3px solid #c62828;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 3px solid #2e7d32;
            font-size: 14px;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .upload-section {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                max-height: 200px;
            }

            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG Chatbot</h1>
            <p>Ask questions about your uploaded documents</p>
            <div class="doc-status" id="docStatus">No document loaded</div>
        </div>

        <div class="main-content">
            <div class="upload-section">
                <h2>Upload Document</h2>
                
                <div class="upload-area" id="uploadArea">
                    <p>📄 Drag & drop your PDF here</p>
                    <small>or click to browse</small>
                </div>

                <div id="fileName" class="file-name" style="display: none;"></div>

                <button class="reset-btn" id="resetBtn" style="display: none;">
                    🔄 Reset
                </button>
            </div>

            <div class="chat-section">
                <div class="messages-container" id="messagesContainer">
                    <div class="message bot">
                        <div class="message-content">
                            👋 Welcome! Upload a PDF document to get started. Then ask me any questions about it!
                        </div>
                    </div>
                </div>

                <div class="input-section">
                    <div id="errorContainer"></div>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="queryInput" 
                            placeholder="Ask a question about your document..." 
                            disabled
                        />
                        <button class="send-btn" id="sendBtn" disabled>
                            Send ✈️
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="pdfInput" accept=".pdf" />

    <script>
        const API_BASE = "http://localhost:8000";
        
        const uploadArea = document.getElementById("uploadArea");
        const pdfInput = document.getElementById("pdfInput");
        const fileName = document.getElementById("fileName");
        const queryInput = document.getElementById("queryInput");
        const sendBtn = document.getElementById("sendBtn");
        const messagesContainer = document.getElementById("messagesContainer");
        const resetBtn = document.getElementById("resetBtn");
        const docStatus = document.getElementById("docStatus");
        const errorContainer = document.getElementById("errorContainer");

        let documentLoaded = false;

        // Upload handling
        uploadArea.addEventListener("click", () => pdfInput.click());

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        pdfInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        async function handleFileUpload(file) {
            if (!file.name.endsWith(".pdf")) {
                showError("Please upload a PDF file.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                console.log("Starting upload for:", file.name);
                showError(""); // Clear errors
                addMessage("bot", "⏳ Uploading and processing document...");

                const response = await fetch(`${API_BASE}/upload`, {
                    method: "POST",
                    body: formData,
                });

                console.log("Response status:", response.status);
                console.log("Response ok:", response.ok);

                const data = await response.json();
                console.log("Response data:", data);

                if (!response.ok) {
                    throw new Error(data.detail || "Upload failed");
                }

                // Update UI
                documentLoaded = true;
                
                // [FIX 1] Use innerHTML and <br> instead of textContent and \n
                fileName.innerHTML = `📄 ${data.filename}<br>(${data.chunks} chunks)`;
                
                fileName.style.display = "block";
                resetBtn.style.display = "block";
                
                queryInput.disabled = false;
                sendBtn.disabled = false;
                
                docStatus.textContent = `✅ Loaded: ${data.filename}`;
                docStatus.classList.add("loaded");

                // [FIX 2] Use <br> for newlines in the chat message
                addMessage("bot", `✅ Document loaded successfully! (${data.chunks} chunks)<br><br>You can now ask questions about the content.`);
                
                console.log("Upload successful!");
                pdfInput.value = "";
            } catch (error) {
                console.error("Upload error:", error);
                showError(`❌ Upload failed: ${error.message}`);
                addMessage("bot", `❌ Upload failed: ${error.message}`);
                pdfInput.value = "";
            }
        }

        // Query handling
        sendBtn.addEventListener("click", () => {
            const query = queryInput.value.trim();
            if (query) {
                handleQuery(query);
            }
        });

        queryInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                const query = queryInput.value.trim();
                if (query) {
                    handleQuery(query);
                }
            }
        });

        async function handleQuery(query) {
            try {
                showError("");
                addMessage("user", query);
                queryInput.value = "";
                sendBtn.disabled = true;
                queryInput.disabled = true;

                addMessage("bot", '<div class="loading"><span></span><span></span><span></span></div>');

                const response = await fetch(`${API_BASE}/query`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ query }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Query failed");
                }

                const data = await response.json();
                
                // Remove loading message
                messagesContainer.removeChild(messagesContainer.lastChild);
                
                let answer = data.answer;
                let sourcesText = "";
                if (data.sources && data.sources.length > 0) {
                    // [FIX 3] Use <br> for newlines in the sources text
                    sourcesText = `<br><br>📖 Sources: Page ${data.sources.join(", ")}`;
                }

                addMessage("bot", answer + sourcesText);
            } catch (error) {
                showError(`Query failed: ${error.message}`);
                addMessage("bot", `❌ Error: ${error.message}`);
            } finally {
                sendBtn.disabled = !documentLoaded;
                queryInput.disabled = !documentLoaded;
            }
        }

        // Reset
        resetBtn.addEventListener("click", async () => {
            try {
                const response = await fetch(`${API_BASE}/reset`, {
                    method: "DELETE",
                });

                if (!response.ok) throw new Error("Reset failed");

                documentLoaded = false;
                fileName.style.display = "none";
                resetBtn.style.display = "none";
                queryInput.disabled = true;
                sendBtn.disabled = true;
                queryInput.value = "";
                pdfInput.value = "";
                
                docStatus.textContent = "No document loaded";
                docStatus.classList.remove("loaded");

                messagesContainer.innerHTML = '';
                addMessage("bot", "👋 System reset! Upload a new document to get started.");
                showError("");
            } catch (error) {
                showError(`Reset failed: ${error.message}`);
            }
        });

        // Utility functions
        function addMessage(role, content) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = content;
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showError(message) {
            const container = document.getElementById("errorContainer");
            if (message) {
                container.innerHTML = `<div class="error-message">${message}</div>`;
            } else {
                container.innerHTML = "";
            }
        }

        // Check server status on load
        window.addEventListener("load", async () => {
            try {
                const response = await fetch(`${API_BASE}/`);
                if (response.ok) {
                    const data = await response.json();
                    console.log("Server status:", data);
                }
            } catch (error) {
                showError(`⚠️ Cannot connect to backend at ${API_BASE}. Make sure the server is running.`);
            }
        });
    </script>
</body>
</html>
